name: loops-portable
services:
  app:
    image: loops-portable:local
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: deploy/portable/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      LOOPS_LOCAL_ONLY: "1"
      GEMINI_API_KEY: ""
      GEMINI_API_KEY_FILE: ""
      GEMINI_MODELS: ""
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - results:/app/results
    networks: [runtime]
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 4g
  gateway:
    image: caddy:2.10.2
    platform: linux/amd64
    restart: unless-stopped
    user: "10001:10001"
    environment:
      HOME: /tmp
      XDG_DATA_HOME: /tmp/data
      XDG_CONFIG_HOME: /tmp/config
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LOOPS_PORT:-8501}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [frontend, runtime]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    # The upstream Caddy executable carries this file capability.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
  ollama:
    image: ${LOOPS_OLLAMA_IMAGE:-ollama/ollama:0.40.13}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - models:/root/.ollama
    networks: [runtime]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
networks:
  frontend: {}
  runtime:
    internal: true
volumes:
  results:
  models:
